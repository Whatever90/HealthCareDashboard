<div class="header">
    <a class="logo" routerLink="/overview" aria-label="TestCare overview">
        <span>TEST</span><span class="logo-accent">CARE</span>
    </a>
    <div class="nav-buttons">
        <a class="nav-button"
           routerLink="/overview"
           routerLinkActive="active bg-azure"
           ariaCurrentWhenActive="page">
            <div class="icon" id="overview-icon">
            </div>
            Overview
        </a>
        <a class="nav-button"
           routerLink="/patients"
           routerLinkActive="active bg-azure"
           [routerLinkActiveOptions]="{ exact: true }"
           ariaCurrentWhenActive="page">
            <div class="icon" id="patients-icon">
            </div>
            Patients
        </a>
        <a class="nav-button"
           routerLink="/schedule"
           routerLinkActive="active bg-azure"
           ariaCurrentWhenActive="page">
            <div class="icon" id="schedule-icon">
            </div>
            Schedule
        </a>
        <a class="nav-button"
           routerLink="/messages"
           routerLinkActive="active bg-azure"
           ariaCurrentWhenActive="page">
            <div class="icon" id="messages-icon">
            </div>
            Message
        </a>
        <a class="nav-button"
           routerLink="/transactions"
           routerLinkActive="active bg-azure"
           ariaCurrentWhenActive="page">
            <div class="icon" id="transactions-icon">
            </div>
            Transactions
        </a>
    </div>
    <div class="profile"
         role="group"
         aria-disabled="true"
         aria-label="Profile controls disabled. Please log in for more details."
         title="Please log in for more details.">
        <div id="profile-pic"></div>
        <div class="profile-details border-end pe-3">
            <p class="profile-name fw-bolder">Dr. Jose Simmons</p>
            <p class="profile-title fw-light">General Practitioner</p>
        </div>
        <div class="settings ps-3 d-flex align-items-center">
            <div id="settings-gear-icon"></div>
            <div id="settings-elepsis-icon"></div>
        </div>
    </div>
</div>
